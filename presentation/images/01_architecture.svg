<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#0b0b0b}
      .s{font-size:12px;fill:#52514e}
      .c{font-size:11px;fill:#52514e;font-family:Menlo,Consolas,monospace}
      .box{fill:#ffffff;stroke:#c9c8c2;stroke-width:1.5}
      .core{fill:#eaf2fc;stroke:#2a78d6;stroke-width:1.5}
      .out{fill:#fdf0ea;stroke:#eb6834;stroke-width:1.5}
      .ln{stroke:#52514e;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="960" height="560" rx="14" fill="#fcfcfb"/>
  <text x="32" y="44" font-size="22" font-weight="800" fill="#0b0b0b">요청 한 건이 지나가는 길</text>
  <text x="32" y="68" class="s">POSIX 소켓 API만 사용 · 외부 HTTP/이벤트 라이브러리 0개 · src/*.c 14개 모듈</text>

  <!-- row 1 -->
  <rect x="32" y="104" width="130" height="78" rx="10" class="box"/>
  <text x="97" y="137" text-anchor="middle" class="t">Client</text>
  <text x="97" y="158" text-anchor="middle" class="s">curl · 브라우저 · ab</text>

  <rect x="200" y="96" width="200" height="94" rx="10" class="core"/>
  <text x="300" y="124" text-anchor="middle" class="t">main.c · net.c</text>
  <text x="300" y="145" text-anchor="middle" class="c">socket→bind→listen</text>
  <text x="300" y="161" text-anchor="middle" class="c">poll(1s) → accept</text>
  <text x="300" y="178" text-anchor="middle" class="s">SO_REUSEADDR · SIGPIPE 무시</text>

  <rect x="438" y="96" width="200" height="94" rx="10" class="core"/>
  <text x="538" y="124" text-anchor="middle" class="t">pool.c</text>
  <text x="538" y="145" text-anchor="middle" class="s">circular queue 128칸 (fd)</text>
  <text x="538" y="163" text-anchor="middle" class="s">worker thread N개 (기본 8)</text>
  <text x="538" y="180" text-anchor="middle" class="c">queue 가득 → EAGAIN → 503</text>

  <rect x="676" y="96" width="252" height="94" rx="10" class="core"/>
  <text x="802" y="124" text-anchor="middle" class="t">conn.c → http.c</text>
  <text x="802" y="145" text-anchor="middle" class="s">\r\n\r\n 로 헤더 경계 판별</text>
  <text x="802" y="163" text-anchor="middle" class="s">Content-Length 만큼 본문 수신</text>
  <text x="802" y="180" text-anchor="middle" class="s">keep-alive 판정 · 400/413/414/501/505</text>

  <line x1="162" y1="143" x2="196" y2="143" class="ln" marker-end="url(#a)"/>
  <line x1="400" y1="143" x2="434" y2="143" class="ln" marker-end="url(#a)"/>
  <line x1="638" y1="143" x2="672" y2="143" class="ln" marker-end="url(#a)"/>

  <!-- router -->
  <path d="M802 190 L802 222" class="ln" marker-end="url(#a)"/>
  <rect x="300" y="226" width="628" height="52" rx="10" fill="#f3f2ef" stroke="#c9c8c2" stroke-width="1.5"/>
  <text x="322" y="250" class="t">CONN_ROUTING</text>
  <text x="322" y="268" class="s">absolute-form? → forward proxy / route 매칭? → reverse proxy / /cgi-bin/ → CGI / 그 외 → 정적</text>

  <!-- cache band -->
  <rect x="32" y="226" width="246" height="52" rx="10" fill="#e8f7f1" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="48" y="250" class="t">cache.c (GET)</text>
  <text x="48" y="268" class="s">64개 · 8MiB · TTL 5s · X-Cache</text>
  <line x1="278" y1="252" x2="296" y2="252" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- outputs -->
  <path d="M396 278 L396 306 M560 278 L560 306 M724 278 L724 306 M880 278 L880 306" class="ln"/>
  <path d="M120 306 L880 306" class="ln"/>
  <path d="M120 306 L120 330" class="ln" marker-end="url(#a)"/>
  <path d="M352 306 L352 330" class="ln" marker-end="url(#a)"/>
  <path d="M592 306 L592 330" class="ln" marker-end="url(#a)"/>
  <path d="M820 306 L820 330" class="ln" marker-end="url(#a)"/>

  <rect x="32" y="334" width="196" height="122" rx="10" class="out"/>
  <text x="130" y="362" text-anchor="middle" class="t">Forward Proxy</text>
  <text x="130" y="383" text-anchor="middle" class="c">-f 옵션</text>
  <text x="130" y="403" text-anchor="middle" class="s">GET http://host/path</text>
  <text x="130" y="421" text-anchor="middle" class="s">→ origin-form 재작성</text>
  <text x="130" y="439" text-anchor="middle" class="s">hop-by-hop 헤더 제거</text>

  <rect x="252" y="334" width="210" height="122" rx="10" class="out"/>
  <text x="357" y="362" text-anchor="middle" class="t">Reverse Proxy</text>
  <text x="357" y="383" text-anchor="middle" class="c">-c routes.conf</text>
  <text x="357" y="403" text-anchor="middle" class="s">Host + 최장 경로 접두사</text>
  <text x="357" y="421" text-anchor="middle" class="s">Round-Robin + 장애 시 다음</text>
  <text x="357" y="439" text-anchor="middle" class="s">502 연결실패 · 504 타임아웃</text>

  <rect x="486" y="334" width="210" height="122" rx="10" class="out"/>
  <text x="591" y="362" text-anchor="middle" class="t">CGI (동적)</text>
  <text x="591" y="383" text-anchor="middle" class="c">fork + execve + pipe</text>
  <text x="591" y="403" text-anchor="middle" class="s">POST 본문 → stdin</text>
  <text x="591" y="421" text-anchor="middle" class="s">QUERY_STRING 환경변수</text>
  <text x="591" y="439" text-anchor="middle" class="s">타임아웃 504 · 실패 500</text>

  <rect x="720" y="334" width="208" height="122" rx="10" class="out"/>
  <text x="824" y="362" text-anchor="middle" class="t">Static File</text>
  <text x="824" y="383" text-anchor="middle" class="c">-r ./www</text>
  <text x="824" y="403" text-anchor="middle" class="s">%XX 해독 · realpath 검사</text>
  <text x="824" y="421" text-anchor="middle" class="s">MIME: html · css · js · png · jpg</text>
  <text x="824" y="439" text-anchor="middle" class="s">403 / 404 / 405 / 500</text>

  <rect x="32" y="480" width="896" height="52" rx="10" fill="#ffffff" stroke="#c9c8c2" stroke-dasharray="5 4"/>
  <text x="52" y="504" class="t">response.c</text>
  <text x="150" y="504" class="s">HTTP/1.1 상태줄 + Content-Type · Content-Length · Connection · Date · Server 헤더</text>
  <text x="150" y="522" class="s">net_send_all(): 끝까지 반복 전송 · 요청별 monotonic deadline 초과 → 408 · 송신은 SO_SNDTIMEO</text>
</svg>
