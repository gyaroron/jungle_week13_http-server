<text x="48" y="514" font-size="12.5" font-weight="700" fill="#2a78d6">발견</text><text x="92" y="514" font-size="12.5" fill="#3a3936">마지막에 넣은 GET 캐시 이후 기능 테스트 19/21 — keep-alive 실패, 같은 URL RR 실패</text>
<text x="48" y="532" font-size="12.5" font-weight="700" fill="#2a78d6">원인</text><text x="92" y="532" font-size="12.5" fill="#3a3936">cache.c가 MISS·HIT 응답에 항상 Connection: close를 쓰고, conn.c도 캐시 경로면 연결을 강제로 닫음</text>
<text x="48" y="550" font-size="12.5" font-weight="700" fill="#2a78d6">수정</text><text x="92" y="550" font-size="12.5" fill="#3a3936">길이가 정해진 응답(정적·HIT)은 요청대로 keep-alive, 프록시 MISS만 close · RR 테스트는 서로 다른 URL로</text>
<text x="48" y="568" font-size="12.5" font-weight="700" fill="#2a78d6">결과</text><text x="92" y="568" font-size="12.5" fill="#3a3936">22/22 통과 · ASan/TSan 0 · keep-alive 부하(worker 128) 15,105 → 23,364 rps</text>
