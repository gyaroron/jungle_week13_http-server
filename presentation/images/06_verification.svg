<text x="48" y="572" font-size="12" font-weight="700" fill="#2a78d6">1c2c4bd</text><text x="120" y="572" font-size="12" fill="#3a3936">GET 캐시를 넣은 뒤 기능 검사 19/21. 캐시가 응답마다 Connection: close를 붙여 keep-alive가 끊김 → 길이가 정해진 응답은 요청대로 유지</text>
