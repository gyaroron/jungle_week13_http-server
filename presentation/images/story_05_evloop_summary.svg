<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="960" height="600" rx="14" fill="#fcfcfb"/>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a32e2e"/></marker>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker>
</defs>
<text x="32" y="44" font-size="22" font-weight="800" fill="#0b0b0b">5. 쉬는 keep-alive 연결과 event loop, 그리고 남은 것</text>
<text x="32" y="68" font-size="13" fill="#52514e">worker 8 · keep-alive 연결 100개 · ab -n 10000 -c 100 · 3회 중앙값</text>

<!-- TOP LEFT: thread pool with idle keep-alive -->
<rect x="32" y="88" width="440" height="236" rx="12" fill="#ffffff" stroke="#c9c8c2"/>
<text x="52" y="114" font-size="15" font-weight="800" fill="#a32e2e">thread pool만 쓸 때</text>
<text x="52" y="134" font-size="11.5" fill="#52514e">응답 뒤 쉬는 연결도 worker를 계속 붙잡음</text>
<g fill="#ecebe7" stroke="#8a8984"><circle cx="70" cy="166" r="10"/><circle cx="70" cy="192" r="10"/><circle cx="70" cy="218" r="10"/><circle cx="70" cy="244" r="10"/></g>
<text x="56" y="272" font-size="11" fill="#52514e">쉬는 연결</text>
<g stroke="#8a8984" stroke-width="1.5" stroke-dasharray="3,4"><line x1="82" y1="166" x2="236" y2="190" marker-end="url(#k)"/><line x1="82" y1="192" x2="236" y2="196" marker-end="url(#k)"/><line x1="82" y1="218" x2="236" y2="214" marker-end="url(#k)"/><line x1="82" y1="244" x2="236" y2="222" marker-end="url(#k)"/></g>
<rect x="242" y="156" width="150" height="100" rx="10" fill="#f3f2ef" stroke="#8a8984"/>
<text x="317" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#3a3936">worker 8</text>
<g fill="#d4d3ce" stroke="#8a8984"><rect x="256" y="184" width="26" height="24" rx="4"/><rect x="288" y="184" width="26" height="24" rx="4"/><rect x="320" y="184" width="26" height="24" rx="4"/><rect x="352" y="184" width="26" height="24" rx="4"/><rect x="256" y="216" width="26" height="24" rx="4"/><rect x="288" y="216" width="26" height="24" rx="4"/><rect x="320" y="216" width="26" height="24" rx="4"/><rect x="352" y="216" width="26" height="24" rx="4"/></g>
<text x="317" y="252" text-anchor="middle" font-size="10" fill="#52514e">모두 쉬는 연결을 기다리는 중</text>
<circle cx="446" cy="206" r="11" fill="#e6f4ec" stroke="#2f855a"/>
<line x1="433" y1="206" x2="410" y2="206" stroke="#a32e2e" stroke-width="1.8" marker-end="url(#r)"/>
<line x1="400" y1="192" x2="400" y2="220" stroke="#a32e2e" stroke-width="3"/>
<text x="446" y="236" text-anchor="middle" font-size="10.5" fill="#a32e2e">새 GET</text>
<text x="52" y="298" font-size="22" font-weight="800" fill="#a32e2e">332 req/s</text>
<text x="52" y="316" font-size="11.5" fill="#a32e2e">실패 46~48건 · 새 GET은 빈 worker가 없음</text>

<!-- TOP RIGHT: event loop -->
<rect x="488" y="88" width="440" height="236" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="508" y="114" font-size="15" font-weight="800" fill="#1d4f91">event loop 추가 (-e)</text>
<text x="508" y="134" font-size="11.5" fill="#52514e">쉬는 연결은 loop가 지켜보고, 요청이 다 온 연결만 worker로</text>
<g fill="#ecebe7" stroke="#8a8984"><circle cx="522" cy="160" r="8"/><circle cx="544" cy="160" r="8"/><circle cx="522" cy="182" r="8"/><circle cx="544" cy="182" r="8"/><circle cx="522" cy="204" r="8"/><circle cx="544" cy="204" r="8"/><circle cx="522" cy="226" r="8"/><circle cx="544" cy="226" r="8"/></g>
<text x="533" y="252" text-anchor="middle" font-size="10.5" fill="#52514e">쉬는 연결</text>
<rect x="572" y="156" width="120" height="84" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="632" y="182" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4f91">loop thread</text>
<text x="632" y="200" text-anchor="middle" font-size="11" fill="#52514e">kqueue / epoll</text>
<text x="632" y="218" text-anchor="middle" font-size="10.5" fill="#52514e">연결을 지켜보기만</text>
<line x1="556" y1="193" x2="568" y2="193" stroke="#8a8984" stroke-width="1.5"/>
<line x1="692" y1="198" x2="736" y2="198" stroke="#2f855a" stroke-width="2" marker-end="url(#g)"/>
<text x="714" y="190" text-anchor="middle" font-size="10" fill="#2f855a">요청 도착</text>
<rect x="742" y="156" width="166" height="84" rx="10" fill="#ffffff" stroke="#2a78d6"/>
<text x="825" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4f91">worker 8</text>
<g fill="#2a78d6"><rect x="756" y="184" width="30" height="20" rx="4"/><rect x="792" y="184" width="30" height="20" rx="4"/><rect x="828" y="184" width="30" height="20" rx="4"/><rect x="864" y="184" width="30" height="20" rx="4"/><rect x="756" y="210" width="30" height="20" rx="4"/><rect x="792" y="210" width="30" height="20" rx="4"/><rect x="828" y="210" width="30" height="20" rx="4"/><rect x="864" y="210" width="30" height="20" rx="4"/></g>
<path d="M820 240 C820 262, 640 262, 634 244" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#g)"/>
<text x="728" y="270" text-anchor="middle" font-size="10.5" fill="#1d4f91">응답 뒤 keep-alive 연결은 다시 loop로 (self-pipe)</text>
<text x="508" y="298" font-size="22" font-weight="800" fill="#2f855a">64,656 req/s</text>
<text x="508" y="316" font-size="11.5" fill="#2f855a">실패 0건 · 쉬는 연결 1,000개 옆에서도 새 GET이 0.6~0.8 ms에 응답</text>

<!-- BOTTOM LEFT: remaining SPOF -->
<rect x="32" y="340" width="440" height="176" rx="12" fill="#ffffff" stroke="#c9c8c2"/>
<text x="52" y="366" font-size="15" font-weight="800" fill="#0b0b0b">아직 남은 SPOF (범위 밖으로 기록)</text>
<g font-size="12.5">
<rect x="52" y="382" width="196" height="54" rx="8" fill="#fdf3dc" stroke="#c98500"/><text x="64" y="404" font-weight="700" fill="#5c3d00">서버 process 1개</text><text x="64" y="424" font-size="11" fill="#52514e">crash 하나에 모든 연결 끊김</text>
<rect x="256" y="382" width="196" height="54" rx="8" fill="#fdf3dc" stroke="#c98500"/><text x="268" y="404" font-weight="700" fill="#5c3d00">loop thread 1개 (-e)</text><text x="268" y="424" font-size="11" fill="#52514e">Blocking 호출을 하지 않게 유지</text>
<rect x="52" y="444" width="196" height="54" rx="8" fill="#fdf3dc" stroke="#c98500"/><text x="64" y="466" font-weight="700" fill="#5c3d00">reverse proxy 자신</text><text x="64" y="486" font-size="11" fill="#52514e">백엔드는 round-robin으로 넘김</text>
<rect x="256" y="444" width="196" height="54" rx="8" fill="#fdf3dc" stroke="#c98500"/><text x="268" y="466" font-weight="700" fill="#5c3d00">짧게 잡는 공유 lock</text><text x="268" y="486" font-size="11" fill="#52514e">목록을 고치는 구간만 잡음</text>
</g>

<!-- BOTTOM RIGHT: verification -->
<rect x="488" y="340" width="440" height="176" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="1.4"/>
<text x="508" y="366" font-size="15" font-weight="800" fill="#2f855a">검증</text>
<rect x="508" y="382" width="128" height="74" rx="8" fill="#e6f4ec"/><text x="572" y="414" text-anchor="middle" font-size="22" font-weight="800" fill="#2f855a">24/24</text><text x="572" y="436" text-anchor="middle" font-size="11" fill="#2f855a">기능 테스트</text><text x="572" y="450" text-anchor="middle" font-size="10" fill="#52514e">-e 모드 25/25</text>
<rect x="646" y="382" width="128" height="74" rx="8" fill="#e6f4ec"/><text x="710" y="414" text-anchor="middle" font-size="22" font-weight="800" fill="#2f855a">0건</text><text x="710" y="436" text-anchor="middle" font-size="11" fill="#2f855a">ASan · TSan 보고</text><text x="710" y="450" text-anchor="middle" font-size="10" fill="#52514e">두 모드 모두</text>
<rect x="784" y="382" width="124" height="74" rx="8" fill="#fdf3dc"/><text x="846" y="414" text-anchor="middle" font-size="22" font-weight="800" fill="#8a5a00">2개 실패</text><text x="846" y="436" text-anchor="middle" font-size="11" fill="#8a5a00">고치기 전 코드</text><text x="846" y="450" text-anchor="middle" font-size="10" fill="#52514e">① · ④ 검사</text>
<text x="508" y="482" font-size="11.5" fill="#52514e">같은 검사를 고치기 전 코드(eaa1fef)에 돌리면 ①, ④ 검사가 실패하고</text>
<text x="508" y="500" font-size="11.5" fill="#52514e">지금 코드에서는 통과한다</text>

<rect x="32" y="530" width="896" height="44" rx="10" fill="#1d4f91"/>
<text x="480" y="558" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">모델을 고르는 것으로 끝나지 않는다 · 고른 모델 안에서 모두가 기다리는 곳을 찾아 없애야 끝까지 버틴다</text>
</svg>
