<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="960" height="600" rx="14" fill="#fcfcfb"/>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
</defs>
<text x="32" y="44" font-size="22" font-weight="800" fill="#0b0b0b">1. 서버가 지켜야 할 세 가지</text>
<text x="32" y="68" font-size="13" fill="#52514e">C + POSIX socket API · HTTP/1.1 서버 + proxy · 이 세 장면에서 멈추지 않아야 한다</text>

<!-- panel 1: slow client -->
<rect x="32" y="92" width="288" height="400" rx="12" fill="#ffffff" stroke="#c9c8c2"/>
<text x="52" y="122" font-size="16" font-weight="800" fill="#1d4f91">① 느린 client</text>
<rect x="196" y="190" width="104" height="200" rx="10" fill="#f3f2ef" stroke="#8a8984"/>
<text x="248" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#3a3936">server</text>
<circle cx="70" cy="200" r="14" fill="#fde7d9" stroke="#c2410c"/><text x="70" y="205" text-anchor="middle" font-size="12" fill="#c2410c">느림</text>
<path d="M86 200 L110 200 M118 200 L134 200 M142 200 L156 200 M164 200 L190 200" stroke="#c2410c" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#o)"/>
<circle cx="70" cy="260" r="12" fill="#e6f4ec" stroke="#2f855a"/>
<circle cx="70" cy="300" r="12" fill="#e6f4ec" stroke="#2f855a"/>
<circle cx="70" cy="340" r="12" fill="#e6f4ec" stroke="#2f855a"/>
<line x1="84" y1="260" x2="190" y2="260" stroke="#2f855a" stroke-width="2" marker-end="url(#g)"/>
<line x1="84" y1="300" x2="190" y2="300" stroke="#2f855a" stroke-width="2" marker-end="url(#g)"/>
<line x1="84" y1="340" x2="190" y2="340" stroke="#2f855a" stroke-width="2" marker-end="url(#g)"/>
<text x="52" y="432" font-size="13" font-weight="700" fill="#0b0b0b">한 연결이 느려도</text>
<text x="52" y="454" font-size="13" fill="#2f855a">다른 요청은 바로 지나간다</text>

<!-- panel 2: burst -->
<rect x="336" y="92" width="288" height="400" rx="12" fill="#ffffff" stroke="#c9c8c2"/>
<text x="356" y="122" font-size="16" font-weight="800" fill="#1d4f91">② 접속 폭주</text>
<g stroke="#52514e" stroke-width="1.4">
<line x1="370" y1="170" x2="450" y2="250" marker-end="url(#k)"/><line x1="370" y1="200" x2="450" y2="260" marker-end="url(#k)"/>
<line x1="370" y1="230" x2="450" y2="270" marker-end="url(#k)"/><line x1="370" y1="260" x2="450" y2="280" marker-end="url(#k)"/>
<line x1="370" y1="290" x2="450" y2="290" marker-end="url(#k)"/><line x1="370" y1="320" x2="450" y2="300" marker-end="url(#k)"/>
<line x1="370" y1="350" x2="450" y2="310" marker-end="url(#k)"/><line x1="370" y1="380" x2="450" y2="320" marker-end="url(#k)"/>
</g>
<rect x="456" y="230" width="148" height="110" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="530" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4f91">worker 8 · queue 128</text>
<g fill="#2a78d6"><rect x="472" y="268" width="22" height="22" rx="4"/><rect x="500" y="268" width="22" height="22" rx="4"/><rect x="528" y="268" width="22" height="22" rx="4"/><rect x="556" y="268" width="22" height="22" rx="4"/>
<rect x="472" y="296" width="22" height="22" rx="4"/><rect x="500" y="296" width="22" height="22" rx="4"/><rect x="528" y="296" width="22" height="22" rx="4"/><rect x="556" y="296" width="22" height="22" rx="4"/></g>
<text x="356" y="432" font-size="13" font-weight="700" fill="#0b0b0b">연결이 몰려도</text>
<text x="356" y="454" font-size="13" fill="#1d4f91">thread · 메모리에 상한이 있다</text>

<!-- panel 3: shared point -->
<rect x="640" y="92" width="288" height="400" rx="12" fill="#ffffff" stroke="#c9c8c2"/>
<text x="660" y="122" font-size="16" font-weight="800" fill="#1d4f91">③ 공유 지점</text>
<g fill="#e6f4ec" stroke="#2f855a"><circle cx="690" cy="190" r="12"/><circle cx="690" cy="240" r="12"/><circle cx="690" cy="290" r="12"/><circle cx="690" cy="340" r="12"/></g>
<g stroke="#2f855a" stroke-width="1.8">
<line x1="704" y1="190" x2="760" y2="190" marker-end="url(#g)"/><line x1="704" y1="240" x2="760" y2="240" marker-end="url(#g)"/>
<line x1="704" y1="290" x2="760" y2="290" marker-end="url(#g)"/><line x1="704" y1="340" x2="760" y2="340" marker-end="url(#g)"/>
</g>
<rect x="766" y="174" width="140" height="32" rx="8" fill="#f3f2ef" stroke="#8a8984"/><text x="836" y="195" text-anchor="middle" font-size="12.5" fill="#3a3936">로그</text>
<rect x="766" y="224" width="140" height="32" rx="8" fill="#f3f2ef" stroke="#8a8984"/><text x="836" y="245" text-anchor="middle" font-size="12.5" fill="#3a3936">캐시</text>
<rect x="766" y="274" width="140" height="32" rx="8" fill="#f3f2ef" stroke="#8a8984"/><text x="836" y="295" text-anchor="middle" font-size="12.5" fill="#3a3936">대기열</text>
<rect x="766" y="324" width="140" height="32" rx="8" fill="#f3f2ef" stroke="#8a8984"/><text x="836" y="345" text-anchor="middle" font-size="12.5" fill="#3a3936">keep-alive 연결</text>
<text x="660" y="432" font-size="13" font-weight="700" fill="#0b0b0b">모두가 쓰는 한 곳이 있어도</text>
<text x="660" y="454" font-size="13" fill="#2f855a">그곳에서 줄 서지 않는다</text>

<rect x="32" y="512" width="896" height="56" rx="10" fill="#fdf3dc" stroke="#c98500"/>
<text x="52" y="536" font-size="13.5" font-weight="700" fill="#5c3d00">이 세 장면이 깨지는 곳 = SPOF (Single Point of Failure)</text>
<text x="52" y="556" font-size="12.5" fill="#3a3936">다음 장: 이 기준으로 동시성 모델을 고르고, 고른 모델 안의 SPOF를 찾는다</text>
</svg>
