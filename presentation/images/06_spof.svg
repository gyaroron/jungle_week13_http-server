<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="960" height="600" rx="14" fill="#fcfcfb"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="32" y="44" font-size="22" font-weight="800" fill="#0b0b0b">단일 장애 지점 (SPOF; Single Point of Failure)</text>
<text x="32" y="68" font-size="13" fill="#52514e">모든 요청이 지나가는데 대신할 길이 없는 곳 · 그 한 곳이 막히면 전체가 멈춤</text>
<rect x="32" y="88" width="896" height="92" rx="10" fill="#ffffff" stroke="#e4e3de"/>
<text x="56" y="108" font-size="12" fill="#52514e">요청 1</text><line x1="104" y1="104" x2="300" y2="134" stroke="#8a8984" stroke-width="1.4" marker-end="url(#a)"/>
<text x="56" y="126" font-size="12" fill="#52514e">요청 2</text><line x1="104" y1="122" x2="300" y2="134" stroke="#8a8984" stroke-width="1.4" marker-end="url(#a)"/>
<text x="56" y="144" font-size="12" fill="#52514e">요청 3</text><line x1="104" y1="140" x2="300" y2="134" stroke="#8a8984" stroke-width="1.4" marker-end="url(#a)"/>
<text x="56" y="162" font-size="12" fill="#52514e">요청 4</text><line x1="104" y1="158" x2="300" y2="134" stroke="#8a8984" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="304" y="110" width="200" height="48" rx="10" fill="#fbeaea" stroke="#c53a3a" stroke-width="1.6"/><text x="404" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">공유 지점 1개</text><text x="404" y="149" text-anchor="middle" font-size="11.5" fill="#a32e2e">lock · 대기열 · 출력</text>
<line x1="504" y1="134" x2="560" y2="134" stroke="#c53a3a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="572" y="128" font-size="13" font-weight="700" fill="#a32e2e">여기서 기다리면 모두 기다림</text><text x="572" y="148" font-size="12" fill="#52514e">thread를 늘려도 같은 곳을 기다리면 해결되지 않음</text>
<text x="32" y="212" font-size="15" font-weight="700" fill="#0b0b0b">찾아서 고친 SPOF 4개 (9ded267)</text>
<rect x="32" y="228" width="440" height="118" rx="10" fill="#ffffff" stroke="#c9c8c2"/>
<text x="48" y="254" font-size="14" font-weight="700" fill="#0b0b0b">① 느린 client → worker</text>
<text x="48" y="276" font-size="12" fill="#a32e2e">전: recv()마다 5초 제한이 다시 시작</text>
<text x="48" y="298" font-size="12" font-weight="700" fill="#0a5c0a">→ 요청 하나에 monotonic deadline 1개</text>
<text x="62" y="316" font-size="12" fill="#0a5c0a">넘으면 408</text>
<text x="48" y="336" font-size="11" fill="#52514e">검사로 재현: 이전 코드 실패</text>
<rect x="488" y="228" width="440" height="118" rx="10" fill="#ffffff" stroke="#c9c8c2"/>
<text x="504" y="254" font-size="14" font-weight="700" fill="#0b0b0b">② 대기열 가득 → accept 반복</text>
<text x="504" y="276" font-size="12" fill="#a32e2e">전: pool_submit()이 not_full에서 기다림</text>
<text x="504" y="298" font-size="12" font-weight="700" fill="#0a5c0a">→ 기다리지 않고 EAGAIN 반환</text>
<text x="518" y="316" font-size="12" fill="#0a5c0a">main이 503을 보내고 닫음</text>
<text x="504" y="336" font-size="11" fill="#52514e">코드 확인 (검사 없음)</text>
<rect x="32" y="358" width="440" height="118" rx="10" fill="#ffffff" stroke="#c9c8c2"/>
<text x="48" y="384" font-size="14" font-weight="700" fill="#0b0b0b">③ 로그 출력</text>
<text x="48" y="406" font-size="12" fill="#a32e2e">전: mutex를 잡은 채 write(stderr)</text>
<text x="48" y="428" font-size="12" font-weight="700" fill="#0a5c0a">→ 256 KiB ring buffer + writer thread</text>
<text x="62" y="446" font-size="12" fill="#0a5c0a">가득 차면 줄을 버리고 개수만 셈</text>
<text x="48" y="466" font-size="11" fill="#52514e">코드 확인 (검사 없음)</text>
<rect x="488" y="358" width="440" height="118" rx="10" fill="#ffffff" stroke="#c9c8c2"/>
<text x="504" y="384" font-size="14" font-weight="700" fill="#0b0b0b">④ 캐시 전역 잠금</text>
<text x="504" y="406" font-size="12" fill="#a32e2e">전: 요청 전체를 rwlock 하나로 감쌈</text>
<text x="504" y="428" font-size="12" font-weight="700" fill="#0a5c0a">→ 요청을 감싸는 잠금 제거</text>
<text x="518" y="446" font-size="12" fill="#0a5c0a">writer 표시 + generation으로 일관성 유지</text>
<text x="504" y="466" font-size="11" fill="#52514e">검사로 재현: 이전 코드 실패</text>
<rect x="32" y="492" width="896" height="88" rx="10" fill="#fdf3dc" stroke="#c98500"/>
<text x="48" y="516" font-size="14" font-weight="700" fill="#5c3d00">아직 남은 SPOF</text>
<text x="48" y="538" font-size="12.5" fill="#3a3936">서버 process 1개 · event loop thread 1개(-e) · reverse proxy 자신 · 짧게 잡는 공유 lock(캐시 목록, route별 round-robin)</text>
<text x="48" y="560" font-size="12.5" fill="#3a3936">원칙: 기다리지 않게 하거나, 기다림에 끝을 두거나, 실패를 빨리 돌려준다(408 · 503)</text>
</svg>